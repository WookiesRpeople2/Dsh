name: Bug report
description: Report incorrect or broken behaviour in Dsh
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Search [existing issues](https://github.com/WookiesRpeople2/Dsh/issues) first.

  - type: dropdown
    id: phase
    attributes:
      label: Which area?
      options:
        - Core shell (parse, execute, pipes, redirects)
        - Builtins (cd, export, alias, theme, exit)
        - Readline / REPL / prompt
        - Configuration
        - Commands (loc, stacktrace, new, replay, …)
        - Windows / cross-platform
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
      placeholder: When I run `cd ~`, the shell prints …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `dsh`
        2. Type `…`
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Dsh version or commit
      placeholder: e.g. v0.1.0 or abc1234

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste terminal output or attach screenshots
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing open issues for duplicates
          required: true
        - label: I can reproduce this on the latest `main` branch
          required: false
