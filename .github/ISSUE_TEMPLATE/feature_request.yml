name: Feature request
description: Suggest a new feature or improvement for Dsh
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature and check [open issues](https://github.com/WookiesRpeople2/Dsh/issues) for duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work from a user's perspective?
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example usage
      placeholder: |
        ```sh
        ⇥ my-new-command --flag
        expected output …
        ```
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / related issues
      description: Link other GitHub issues (e.g. #7, #17)
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests
          required: true
        - label: I am willing to help implement this
          required: false
